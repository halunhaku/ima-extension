name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Rebuild an existing vX.Y.Z tag release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve release tag
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z." >&2
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/release-version.mjs "$TAG"

      - name: Run tests
        run: npm test

      - name: Validate release
        run: npm run validate

      - name: Package extension
        run: npm run package

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          ASSET="dist/web-clipper-for-ima-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing its asset."
          else
            gh release create "$TAG" --verify-tag --title "Web Clipper for ima $TAG" --notes "Automated release for $TAG."
          fi
          gh release upload "$TAG" "$ASSET" --clobber

      - name: Summarize release failure
        if: failure()
        run: |
          {
            echo "## Release stopped"
            echo "The GitHub Release is only created after tests, validation, and packaging all succeed."
            echo "Inspect the failed step, fix it, then rerun the workflow for the same tag."
          } >> "$GITHUB_STEP_SUMMARY"
